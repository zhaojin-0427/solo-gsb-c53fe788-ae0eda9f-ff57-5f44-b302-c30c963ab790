services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tail
      POSTGRES_PASSWORD: tail
      POSTGRES_DB: tailsampling
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tail -d tailsampling"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TS_DATABASE_URL: postgresql+asyncpg://tail:tail@db:5432/tailsampling
      TS_WINDOW_MS: "30000"
      TS_HARD_WATERMARK_MS: "60000"
      TS_SWEEP_INTERVAL_MS: "1000"
    ports:
      - "8080:8080"

volumes:
  pgdata:
